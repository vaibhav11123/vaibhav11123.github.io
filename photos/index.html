<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photographs | Vaibhav Singh</title>
<meta name="description" content="Photographs by Vaibhav Singh: night streets, rain, lanterns and other frames.">
<link rel="canonical" href="https://vaibhav11123.github.io/photos/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f6; --ink:#1b1a17; --body:#43413b; --muted:#6f6d66; --faint:#a6a49c;
  --line:#e8e6e0; --ok:#1a7f37; --hl:#fde68a;
}
html[data-theme=dark]{
  --bg:#171613; --ink:#eceae5; --body:#c9c7c0; --muted:#9c9a92; --faint:#66645e;
  --line:#2b2925; --ok:#4ade80; --hl:#854d0e;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:17px;line-height:1.62;transition:background .25s ease,color .25s ease}
.wrap{max-width:636px;margin:0 auto;padding:0 24px}
a{color:inherit}
::selection{background:var(--hl);color:#1b1a17}
img,video{display:block;max-width:100%}

.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0;font-family:"Geist Mono",ui-monospace,monospace;font-size:12.5px}
.top a{text-decoration:none;color:var(--ink)}
.top .controls{display:flex;align-items:center;gap:16px}
.back{color:var(--faint);transition:color .2s}
.back:hover{color:var(--ink)}
.icon-btn{font:inherit;color:var(--faint);background:none;border:0;cursor:pointer;padding:0;transition:color .2s}
.icon-btn:hover{color:var(--ink)}
.icon-btn svg{display:block;width:15px;height:15px}

.hero{padding:64px 0 8px}
h1{font-weight:600;font-size:44px;letter-spacing:-.01em;line-height:1.05}
.hero p{margin-top:18px;color:var(--body);max-width:56ch}

.grid{margin-top:44px;columns:2;column-gap:14px}
.grid .ph{break-inside:avoid;margin-bottom:14px}
.grid img,.grid video{width:100%;border:1px solid var(--line);border-radius:6px;background:#121114}
.grid img{cursor:zoom-in}
.grid video{cursor:pointer}
.ph figcaption{margin-top:6px;font-family:"Geist Mono",ui-monospace,monospace;font-size:11.5px;color:var(--muted)}

footer{margin-top:72px;border-top:1px solid var(--line);padding:26px 0 40px;font-family:"Geist Mono",ui-monospace,monospace;font-size:12.5px;color:var(--muted)}
footer .bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer a{text-decoration:none}
footer a:hover{color:var(--ink)}
.sysline{margin-top:14px;font-size:11.5px;color:var(--faint)}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:32px}
.lightbox.open{display:flex}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:8px}

@media (max-width:640px){
  h1{font-size:34px}
  .hero{padding:44px 0 4px}
  .grid{columns:1}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="/" class="back">&larr; vaibhav</a>
    <div class="controls">
      <button id="theme" class="icon-btn" type="button" aria-label="toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="hero">
      <h1>photographs</h1>
      <p>a few photographs i've taken.</p>
    </div>

    <div class="grid">
      <div class="ph"><img src="/assets/photos/p01.jpg" data-zoom alt="a narrow street at night in the rain, bunting overhead and a lit bar sign"><figcaption>hanoi in the rain &middot; august 2026</figcaption></div>
      <div class="ph"><img src="/assets/photos/p06.jpg" data-zoom alt="paper lanterns glowing in a dark wooden corridor"><figcaption>temple of literature, hanoi &middot; august 2026</figcaption></div>
      <div class="ph"><video controls muted playsinline preload="none" poster="/assets/photos/v-rain-poster.jpg" src="/assets/photos/v-rain.mp4"></video></div>
      <div class="ph"><img src="/assets/photos/p04.jpg" data-zoom alt="a dark covered passage, wet stone floor reflecting light from the far end"><figcaption>hanoi, past midnight &middot; august 2026</figcaption></div>
      <div class="ph"><img src="/assets/photos/p02.jpg" data-zoom alt="rainy intersection at night, restaurant lights reflecting on wet asphalt"><figcaption>hanoi, past midnight &middot; august 2026</figcaption></div>
      <div class="ph"><img src="/assets/photos/p05.jpg" data-zoom alt="a red-lit bridge over a lake at night, reflections in the water"><figcaption>the huc bridge, hoan kiem lake &middot; august 2026</figcaption></div>
      <div class="ph"><img src="/assets/photos/p03.jpg" data-zoom alt="a small tram cart at a night market in the rain"><figcaption>weekend night market, hanoi &middot; august 2026</figcaption></div>
      <div class="ph"><img src="/assets/photos/p07.jpg" data-zoom alt="a corridor hung with red decorations, opening onto a bright courtyard"><figcaption>hanoi &middot; august 2026</figcaption></div>
      <div class="ph"><video controls muted playsinline preload="none" poster="/assets/photos/v-car-poster.jpg" src="/assets/photos/v-car.mp4"></video><figcaption>hanoi at night &middot; august 2026</figcaption></div>
      <div class="ph"><img src="/assets/photos/p08.jpg" data-zoom alt="a large grey stone mausoleum under an overcast sky"><figcaption>ho chi minh mausoleum, hanoi &middot; august 2026</figcaption></div>
      <div class="ph"><img src="/assets/photos/p09.jpg" data-zoom alt="a gothic cathedral facade with flags on an overcast day"><figcaption>st. joseph's cathedral, hanoi &middot; august 2026</figcaption></div>
      <div class="ph"><img src="/assets/photos/p10.jpg" data-zoom alt="a red wooden temple walkway with trees behind"><figcaption>temple of literature, hanoi &middot; august 2026</figcaption></div>
      <div class="ph"><img src="/assets/photos/p11.jpg" data-zoom alt="a weathered wall with a colorful painted-face poster"></div>
      <div class="ph"><img src="/assets/photos/p12.jpg" data-zoom alt="a doorway covered in layered stickers and posters"><figcaption>old quarter, hanoi &middot; august 2026</figcaption></div>
      <div class="ph"><img src="/assets/photos/p13.jpg" data-zoom alt="a utility pole wrapped in orange conduit and stickers"></div>
      <div class="ph"><img src="/assets/photos/p14.jpg" data-zoom alt="porcelain statues and vases in an antique shop"><figcaption>an antique shop in the old quarter &middot; august 2026</figcaption></div>
      <div class="ph"><img src="/assets/photos/p15.jpg" data-zoom alt="bowls of ramen on a red-tiled counter"><figcaption>dinner in the old quarter &middot; august 2026</figcaption></div>
      <div class="ph"><img src="/assets/photos/p16.jpg" data-zoom alt="a concert stage lit red, the crowd in silhouette"><figcaption>a show in delhi &middot; october 2026</figcaption></div>
    </div>
  </main>

  <footer>
    <div class="bar">
      <span>vaibhav singh © 2026</span>
      <nav><a href="/">home</a></nav>
    </div>
    <p class="sysline" id="sysline"></p>
  </footer>
</div>

<div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>

<script>
(function(){
  var root=document.documentElement;
  var q=new URLSearchParams(location.search);
  var theme=q.get('theme')||localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  function apply(){
    if(theme==='dark'){root.setAttribute('data-theme','dark')}else{root.removeAttribute('data-theme')}
    localStorage.setItem('theme',theme);
  }
  document.getElementById('theme').onclick=function(){theme=theme==='dark'?'light':'dark';apply()};

  var lb=document.getElementById('lightbox'),li=document.getElementById('lightbox-img');
  Array.prototype.forEach.call(document.querySelectorAll('[data-zoom]'),function(img){
    img.onclick=function(){li.src=img.src;li.alt=img.alt;lb.classList.add('open')};
  });
  lb.onclick=function(){lb.classList.remove('open')};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')lb.classList.remove('open')});

  // pause any playing video when another starts
  document.addEventListener('play',function(e){
    Array.prototype.forEach.call(document.querySelectorAll('video'),function(v){if(v!==e.target)v.pause()});
  },true);

  var sys=document.getElementById('sysline');
  function tick(){
    var t=new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit'});
    sys.textContent='new delhi '+t+' ist · '+(theme==='dark'?'dark':'light');
  }
  tick();setInterval(tick,30000);
  document.getElementById('theme').addEventListener('click',function(){setTimeout(tick,10)});
  apply();
})();
</script>
</body>
</html>
